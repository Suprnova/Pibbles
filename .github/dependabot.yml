version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # CsCheck 5 drops net8.0, which the tests still run on.
      - dependency-name: CsCheck
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Must match the oldest VS Code the extension supports (engines.vscode).
      - dependency-name: "@types/vscode"
      # Follows the Node version CI uses.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
