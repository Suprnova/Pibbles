name: VS Code extension pre-release

# Attaches the extension's .vsix to a GitHub pre-release. Run it by hand, or push a tag such as vscode-v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['vscode-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run package

      - name: Attach to a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="vscode-v$version"
          gh release create "$tag" pibbles-$version.vsix --prerelease --title "VS Code extension $version" --target "$GITHUB_SHA" \
            --notes "Install with: code --install-extension pibbles-$version.vsix"
