name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release -p:TestAllTargets=true

      - name: Test on net8.0 and net10.0
        run: dotnet test --configuration Release --no-build -p:TestAllTargets=true

      - name: Check the sample story
        run: |
          echo "::add-matcher::.github/pibbles-problem-matcher.json"
          dotnet run --project src/Pibbles.Cli --configuration Release --no-build -- check samples/kitchen --release --warnaserror --format msbuild

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Test the grammar
        run: npm test

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: pibbles-vsix
          path: editors/vscode/*.vsix
